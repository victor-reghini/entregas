# Netlify Configuration for SPX Express Delivery App

[build]
  command = "node scripts/inject-env.js"
  publish = "."

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = "js/env.js"
  SECRETS_SCAN_OMIT_KEYS = "TEST_USER_EMAIL,TEST_USER_PASSWORD"

# Permissões explícitas para Câmera (QR Code Scanner) e GPS (Geolocalização)
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), geolocation=(self)"

# Cache inteligente para assets estáticos
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
