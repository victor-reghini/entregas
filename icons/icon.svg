<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <g filter="url(#shadow)">
    <!-- Box isometric -->
    <path d="M 256 120 L 376 180 L 256 240 L 136 180 Z" fill="#FFF8E1"/>
    <path d="M 136 180 L 256 240 L 256 360 L 136 300 Z" fill="#FFC107"/>
    <path d="M 256 240 L 376 180 L 376 300 L 256 360 Z" fill="#FFA000"/>
    <!-- Tape -->
    <path d="M 236 130 L 276 150 L 276 230 L 236 210 Z" fill="#D84315" opacity="0.6"/>
    <path d="M 246 235 L 266 245 L 266 360 L 246 350 Z" fill="#D84315" opacity="0.6"/>
    <!-- Checkmark Badge -->
    <circle cx="370" cy="140" r="42" fill="#2E7D32"/>
    <path d="M 352 140 L 365 153 L 390 128" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Speed Lines -->
    <path d="M 60 205 L 115 205" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <path d="M 45 245 L 105 245" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <path d="M 70 285 L 115 285" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>